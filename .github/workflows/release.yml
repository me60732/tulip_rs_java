# Release: publish to Maven Central with the classic token + GPG flow.
# One-time secrets configured in repo Settings → Secrets and variables → Actions:
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  (the Central Portal token pair)
#   GPG_PRIVATE_KEY                      (armored `gpg --export-secret-keys` output)
#   GPG_PASSPHRASE                       (the key's passphrase)
# The public half must be uploaded to keys.openpgp.org so Central can verify
# the signatures (see README "Releasing").
#
# Cut a release:
#   1. bump <version> in pom.xml (must equal the tag without the leading "v")
#   2. git commit && git tag v0.2.10 && git push origin main --tags
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Assert pom version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PV=$(mvn -q -B -Dtulip.natives.skip=true org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
                 -Dexpression=project.version -DforceStdout)
          TV="${GITHUB_REF_NAME#v}"
          [ "$PV" = "$TV" ] || { echo "pom version $PV != tag $TV"; exit 1; }

      # Native lib + integration canary: all examples must pass before anything
      # is published (uses bootstrap.sh --prebuilt, same as CI).
      - name: Install native library (prebuilt release asset)
        run: ./bootstrap.sh --prebuilt

      - name: Integration test (all examples)
        run: sh test.sh

      # Package the portable-baseline cdylibs from the matching tulip_rs_ffi
      # release (version-locked: ffi tag == project version) into classifier
      # jars the pom's ci-natives profile attaches. Requires ffi >= 0.2.10:
      # that release is the first whose windows asset carries the DLL.
      - name: Package embedded native binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(mvn -q -B -Dtulip.natives.skip=true org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
                 -Dexpression=project.version -DforceStdout)
          mkdir -p target/natives
          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            case "$plat" in
              linux-*)   fn=libtulip_rs_ffi.so ;;
              darwin-*)  fn=libtulip_rs_ffi.dylib ;;
              # Rust names Windows cdylibs WITHOUT the lib prefix, and the
              # same asset also carries a .a for Go which we ignore.
              windows-*) fn=tulip_rs_ffi.dll ;;
            esac
            gh release download "v$V" -R me60732/tulip_rs_ffi \
               -p "tulip_rs_ffi-$plat.tar.gz" -D dl
            mkdir -p "stage/$plat"
            tar xzf "dl/tulip_rs_ffi-$plat.tar.gz" -C "stage/$plat"
            mkdir -p "stage/$plat/native/$plat"
            cp "stage/$plat/lib/$fn" "stage/$plat/native/$plat/"
            jar --create --file "target/natives/tulip-rs-java-$V-$plat.jar" \
                -C "stage/$plat" "native/$plat"
          done
          ls -la target/natives

      - name: Configure Central token + GPG passphrase
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<XML
          <settings><servers>
            <server><id>central</id>
              <username>$CENTRAL_USERNAME</username>
              <password>$CENTRAL_PASSWORD</password>
            </server>
            <server><id>gpg.passphrase</id>
              <passphrase>$GPG_PASSPHRASE</passphrase>
            </server>
          </servers></settings>
          XML

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign + deploy to Maven Central
        run: mvn -B -ntp -Dtulip.natives.skip=true deploy -Prelease,ci-natives
